# Publishes the sites on every push to main to Cloudflare Pages, at
# temp.schryer.eu (the temp site in schryer/schryer-eu-infra's
# pubkit.json). While visit.ee is in development it is on Pages only,
# with no copy on the web server.
#
# It stays off until the hosting exists: set the repository variable
# VISIT_EE_DEPLOY to "on" once the Pages project and the secrets below
# are in place.
name: deploy

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VISIT_EE_DEPLOY == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # The map packs live on the maps-data branch, outside main's history
      # (about 60 MB, replaced whenever the map data is rebuilt). Without
      # the branch the site still builds, and the map has no background.
      - name: Fetch the map packs
        run: |
          if git ls-remote --exit-code --heads origin maps-data; then
            git fetch --depth 1 origin maps-data
            mkdir _maps
            git archive FETCH_HEAD | tar -x -C _maps
          fi
      # temp.schryer.eu is a preview: it asks search engines to keep out
      # until the site moves to visit.ee and builds with --env production.
      - run: bin/visit-ee build --out _site --env preview --url https://temp.schryer.eu $([ -d _maps ] && echo --maps _maps)
      - uses: schryer/pubkit/actions/deploy-static@v0.14.0
        with:
          dir: _site
          # A token that may deploy Cloudflare Pages and nothing else.
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_GITHUB_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project: visit-ee
