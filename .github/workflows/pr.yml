# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-checks.yml@2c986f9ce17ac43e22b951a9da209c592475bb05 # v0.25.0
    with: {"shellcheck": "with-secrets bin/visit-ee"}

  tests:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-service-tests.yml@0e5477594d4ce20e411721c86d40a6547f026db9 # v0.29.0
    with: {"setup": "make venv node", "test": "make functional"}

  sonar:
    name: ci
    needs: [tests]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@2c986f9ce17ac43e22b951a9da209c592475bb05 # v0.25.0
    with: {"reports": "sonar.python.coverage.reportPaths=*.xml sonar.javascript.lcov.reportPaths=lcov.info"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The site as deploy-static checks it before a deploy, so a site that
  # would fail to deploy fails the pull request. It deploys nothing.
  site:
    name: ci / site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: "npm ci && bin/visit-ee build --out _site --env preview --url https://temp.schryer.eu"
      - uses: Sustenaut/pubkit/actions/deploy-static@2c986f9ce17ac43e22b951a9da209c592475bb05 # v0.25.0
        with: {"dir": "_site", "check-only": "true"}

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [checks, tests, sonar, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
